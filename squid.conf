visible_hostname mindroom-egress-proxy

http_port 0.0.0.0:3128

pid_filename /tmp/squid.pid
coredump_dir /tmp
cache_log stdio:/dev/stderr
access_log stdio:/dev/stdout
logfile_rotate 0
shutdown_lifetime 2 seconds
pinger_enable off

cache deny all
cache_mem 16 MB
maximum_object_size_in_memory 0 KB

acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

acl forbidden_dst dst 0.0.0.0/8
acl forbidden_dst dst 10.0.0.0/8
acl forbidden_dst dst 100.64.0.0/10
acl forbidden_dst dst 127.0.0.0/8
acl forbidden_dst dst 169.254.0.0/16
acl forbidden_dst dst 172.16.0.0/12
acl forbidden_dst dst 192.0.0.0/24
acl forbidden_dst dst 192.0.2.0/24
acl forbidden_dst dst 192.168.0.0/16
acl forbidden_dst dst 198.18.0.0/15
acl forbidden_dst dst 198.51.100.0/24
acl forbidden_dst dst 203.0.113.0/24
acl forbidden_dst dst 224.0.0.0/4
acl forbidden_dst dst 240.0.0.0/4
acl forbidden_dst dst ::/128
acl forbidden_dst dst ::1/128
acl forbidden_dst dst 100::/64
acl forbidden_dst dst 2001:db8::/32
acl forbidden_dst dst fc00::/7
acl forbidden_dst dst fe80::/10
acl forbidden_dst dst ff00::/8

acl approved_static dstdomain "/etc/mindroom-egress/allowed-domains.txt"

external_acl_type approved_egress ttl=0 negative_ttl=0 children-startup=1 children-max=4 %SRC %DST %PORT %METHOD /app/.venv/bin/mindroom-egress-proxy helper
acl approved_dynamic external approved_egress

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny forbidden_dst
http_access allow approved_static Safe_ports
http_access allow approved_dynamic Safe_ports
http_access deny all
